[package]
name = "drot_tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Interactive TUI for the Dhara Repository Orchestration Tool."
publish = false

[[bin]]
name = "drot_tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
drot_dhara_storage = { path = "../drot_dhara_storage" }
drot_kernel = { path = "../drot_kernel" }
ratatui = "0.30"
ratatui-crossterm = "0.1"
ratatui-interact = { version = "0.5", features = ["filesystem"] }
unicode-width = "0.2"
