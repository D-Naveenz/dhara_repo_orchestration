[package]
name = "drot_dhara_storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dhara Storage product plugin for the DROT orchestration tool."
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dhara_storage_dal = { version = "0.9.0" }
drot_kernel = { path = "../drot_kernel" }
once_cell = "1.21"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
sevenz-rust = "0.6"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1"
xmltree = "0.12.0"

[dev-dependencies]
tempfile = "3.27"
