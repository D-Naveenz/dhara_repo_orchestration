[package]
name = "drot_kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared kernel for the Dhara operator tool (host APIs, paths, config, logging)."
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4"
once_cell = "1.21"
rayon = "1.12"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
xmltree = "0.12.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
