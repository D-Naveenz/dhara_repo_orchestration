[package]
name = "drot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dhara Repository Orchestration Tool — direct CLI for workflows, scripts, and agents."
readme = "../../README.md"
documentation = "https://github.com/D-Naveenz/dhara_repo_orchestration"
keywords = ["tooling", "release", "nuget", "verification", "defs"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[features]
default = ["extension-dhara-storage"]
extension-dhara-storage = ["dep:drot_dhara_storage"]

[dependencies]
anyhow = "1.0"
drot_dhara_storage = { path = "../drot_dhara_storage", optional = true }
drot_kernel = { path = "../drot_kernel" }

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
