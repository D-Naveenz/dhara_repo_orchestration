name: Package Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checkout_sha:
        description: Optional commit SHA to pack (submodule pin). Empty = push/dispatch tip.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  pack-windows:
    name: pack (windows-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Prefer dispatch ref (host should --ref <submodule SHA>). Optional
          # checkout_sha overrides when dispatching from another branch tip.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_sha != '' && github.event.inputs.checkout_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build drot (dist)
        run: cargo build -p drot --profile dist

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          cp target/dist/drot.exe dist-out/drot.exe
          if [ -d target/dist/package ]; then
            cp -a target/dist/package dist-out/package
          elif [ -d crates/drot_dhara_storage/package ]; then
            cp -a crates/drot_dhara_storage/package dist-out/package
          fi

      - name: Upload drot-windows-x64
        uses: actions/upload-artifact@v7
        with:
          name: drot-windows-x64
          path: dist-out/
          if-no-files-found: error

  pack-linux:
    name: pack (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_sha != '' && github.event.inputs.checkout_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build drot (dist)
        run: cargo build -p drot --profile dist

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          cp target/dist/drot dist-out/drot
          chmod +x dist-out/drot
          if [ -d target/dist/package ]; then
            cp -a target/dist/package dist-out/package
          elif [ -d crates/drot_dhara_storage/package ]; then
            cp -a crates/drot_dhara_storage/package dist-out/package
          fi

      - name: Upload drot-linux-x64
        uses: actions/upload-artifact@v7
        with:
          name: drot-linux-x64
          path: dist-out/
          if-no-files-found: error
