name: Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    # Skip Dependabot version-update PRs into development (land via auto-merge;
    # pack on push to main after development → main merge).
    if: >
      !(github.event.pull_request.user.login == 'dependabot[bot]'
        && github.base_ref == 'development')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy (CLI path)
        run: cargo clippy -p drot -p drot_dhara_storage -p drot_kernel --all-targets -- -D warnings

      - name: Cargo test (CLI path)
        run: cargo test -p drot -p drot_dhara_storage -p drot_kernel

      - name: Cargo clippy (TUI)
        run: cargo clippy -p drot_tui --all-targets
