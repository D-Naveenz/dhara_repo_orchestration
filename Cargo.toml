[workspace]
members = [
    "crates/drot_kernel",
    "crates/drot_dhara_storage",
    "crates/drot_tui",
    "crates/drot",
]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/D-Naveenz/dhara_repo_orchestration"
homepage = "https://github.com/D-Naveenz/dhara_repo_orchestration"

# Ship profile — DROT Package Pipeline (`cargo build -p drot --release`).
# Fat LTO is worth the link time on CI; local day-to-day builds use `dist` instead.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Local profile — host `ensure-drot-dist` / `run-drot` (`--profile dist` → `target/dist/`).
# Same speed/size knobs as release, but thin LTO so rebuilds stay tolerable on a workstation.
[profile.dist]
inherits = "release"
lto = "thin"
