[workspace]
members = [
    "crates/drot_kernel",
    "crates/drot_dhara_storage",
    "crates/drot_tui",
    "crates/drot",
]
resolver = "3"

[workspace.package]
version = "0.9.13"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/D-Naveenz/dhara_repo_orchestration"
homepage = "https://github.com/D-Naveenz/dhara_repo_orchestration"

# Operator CLI — packed by DROT CI; storage downloads artifacts by submodule SHA
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
